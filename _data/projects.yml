# Active side projects, shown on the homepage.
# To add one: copy an "items" entry below and fill it in.
# status: public | private  (private items just skip the "links" block)

- group: "Pañcāṅga & timekeeping"
  items:
    - title: "Jyotisha"
      status: public
      description: >
        jyotisha is an open-source Python library for the astronomical and 
        calendrical vedāṅga of the Hindus. It computes pañcāṅga elements — 
        tithi, nakṣatra, yoga, karaṇa, muhūrta — from precise ephemerides, and 
        generates location-specific festival calendars for any year in 
        printable, HTML and ICS-subscribable formats. MIT-licensed, installable 
        from PyPI. Co-maintained with [Vishvas Vasuki](https://vishvasa.github.io/).
      links:
        - text: "Jyotisha on GitHub →"
          url: "http://github.com/jyotisham/jyotisha"

    - title: "Adyatithi"
      status: public
      description: >
        adyatithi is the core festival database behind jyotisha — 
        several thousand TOML records of Hindu observances, vratas and 
        ārādhanās, each specifying its timing rule (lunar month and tithi, 
        solar month, nakṣatra, or an offset from another event) alongside 
        descriptions, scriptural references and śloka citations. Included in 
        jyotisha as a submodule.
      links:
        - text: "Read on Substack →"
          url: "https://adyatithi.substack.com"
        - text: "GitHub Adyatithi →"
          url: "http://github.com/jyotisham/adyatithi"

    - title: "Adyatithi Substack"
      status: public
      description: >
        adyatithi — a newsletter on the Hindu calendar. Each post takes up a tithi, vrata or festival falling in the days ahead, and traces the observance to its Purāṇic or nibandha source. Dates are computed with jyotisha from the open adyatithi festival database, for several locations across the world.
      links:
        - text: "Read on Substack →"
          url: "https://adyatithi.substack.com"

    - title: "Ghatika Clock"
      status: public
      description: >
        A live web clock for traditional Indian timekeeping — divides
        each sunrise-to-sunrise day into 30 ghatikas (with finer
        subdivisions), computed from local sunrise/sunset, esp. for timing
        Sandhyāvandanam etc.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/karthikraman/ghatika-clock"
        - text: "Try it out →"
          url: "https://ghatika-clock.web.app"


- group: "Scripts & texts"
  items:
    - title: "LipiSetu"
      status: private
      description: >
        A "bridge" (setu) for learning various Indic scripts (lipi) — a 
        gamified approach to learning one script (e.g. Telugu/grantha) building
        on the knowledge of another (e.g. devanagari/IAST).
      links:
        - text: "Try it out →"
          url: "https://lipisetu.web.app/"

    - title: "StotraSamhita"
      status: public
      description: >
        A long-running effort to digitise and carefully proof-read
        Sanskrit stotras, and typeset them beautifully across multiple
        Indic scripts — a whole organisation of repos, one per text or
        script edition (see below).
      links:
        - text: "stotrasamhita.net →"
          url: "https://stotrasamhita.net"
        - text: "GitHub org →"
          url: "https://github.com/StotraSamhita"

    - title: "Devanagari Flashcards"
      status: public
      description: >
        Flashcards for learning Devanagari alongside other South
        Indian scripts (IAST, Grantha, Kannada, Telugu) — LaTeX-built
        printable PDFs plus a vocabulary spreadsheet.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/sanskrit-coders/devanagari-flashcards"

