# Active side projects, shown on the homepage.
# To add one: copy an "items" entry below and fill it in.
# status: public | private  (private items just skip the "links" block)

- group: "Pañcāṅga & timekeeping"
  items:
    - title: "Adyātithi"
      status: private
      description: >
        A Pañcāṅga (Hindu luni-solar calendar) engine that powers the
        Adyātithi newsletter — day-to-day notes on tithi, nakshatra and
        festival dates.
      links:
        - text: "Read on Substack →"
          url: "https://adyatithi.substack.com"

    - title: "Pañcāṅgam"
      status: public
      description: >
        Swiss-ephemeris–based Pañcāṅga calculator for any location and
        year — tithi, nakshatra, yoga, karaṇa and vāra, plus Hindu
        festival dates. Outputs printable monthly/daily PDFs and
        standard ICS calendar files.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/karthikraman/panchangam"

    - title: "Kamakoti Pañcāṅgam"
      status: private
      description: >
        A Pañcāṅga variant following Kanchi Kamakoti Peetham
        conventions, for a specific community's calendar and
        observance needs.

    - title: "Ghatika Clock"
      status: public
      description: >
        A live web clock for traditional Indian timekeeping — divides
        each sunrise-to-sunrise day into 30 ghatikas (with finer
        subdivisions), computed from local sunrise/sunset, for ritual
        scheduling.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/karthikraman/ghatika-clock"

- group: "Scripts & texts"
  items:
    - title: "LipiSetu"
      status: private
      description: >
        A "bridge" (setu) for transliterating between Devanagari and
        other Indic scripts (lipi) — a tool for cleaner cross-script
        Sanskrit text.

    - title: "StotraSamhita"
      status: public
      description: >
        A long-running effort to digitise and carefully proof-read
        Sanskrit stotras, and typeset them beautifully across multiple
        Indic scripts.
      links:
        - text: "stotrasamhita.net →"
          url: "https://stotrasamhita.net"
        - text: "GitHub org →"
          url: "https://github.com/StotraSamhita"

- group: "Games & other"
  items:
    - title: "Carmen India"
      status: private
      description: >
        A Carmen Sandiego–style geography and culture guessing game
        set across India — currently in development.
