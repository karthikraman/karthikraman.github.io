# Active side projects, shown on the homepage.
# To add one: copy an "items" entry below and fill it in.
# status: public | private  (private items just skip the "links" block)

- group: "Pañcāṅga & timekeeping"
  items:
    - title: "Adyātithi"
      status: public
      description: >
        A repository of various festivals.
      links:
        - text: "Read on Substack →"
          url: "https://adyatithi.substack.com"
        - text: "GitHub Adyatithi →"
          url: "http://github.com/jyotisham/adyatithi"

    - title: "Ghatika Clock"
      status: public
      description: >
        A live web clock for traditional Indian timekeeping — divides
        each sunrise-to-sunrise day into 30 ghatikas (with finer
        subdivisions), computed from local sunrise/sunset, esp. for timing
        Sandhyāvandanam etc.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/karthikraman/ghatika-clock"
        - text: "Try it out →"
          url: "https://ghatika-clock.web.app"


- group: "Scripts & texts"
  items:
    - title: "LipiSetu"
      status: private
      description: >
        A "bridge" (setu) for learning various Indic scripts (lipi) — a 
        gamified approach to learning one script (e.g. Telugu/grantha) building
        on the knowledge of another (e.g. devanagari/IAST).
      links:
        - text: "Try it out →"
          url: "https://lipisetu.web.app/"

    - title: "StotraSamhita"
      status: public
      description: >
        A long-running effort to digitise and carefully proof-read
        Sanskrit stotras, and typeset them beautifully across multiple
        Indic scripts — a whole organisation of repos, one per text or
        script edition (see below).
      links:
        - text: "stotrasamhita.net →"
          url: "https://stotrasamhita.net"
        - text: "GitHub org →"
          url: "https://github.com/StotraSamhita"

    - title: "Devanagari Flashcards"
      status: public
      description: >
        Flashcards for learning Devanagari alongside other South
        Indian scripts (IAST, Grantha, Kannada, Telugu) — LaTeX-built
        printable PDFs plus a vocabulary spreadsheet.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/sanskrit-coders/devanagari-flashcards"

- group: "Games & other"
  items:
    - title: "Carmen India"
      status: private
      description: >
        A Carmen Sandiego–style geography and culture guessing game
        set across India — currently in development.
      links:
        - text: "Try it out →"
          url: "https://karthikraman.github.io/carmen-india-game/"
