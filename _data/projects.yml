  items:
    - title: "LipiSetu"
      status: private
      description: >
        A "bridge" (setu) for transliterating between Devanagari and
        other Indic scripts (lipi) — a tool for cleaner cross-script
        Sanskrit text.
      links:
        - text: "Try it out →"
          url: "https://lipisetu.web.app/"

    - title: "StotraSamhita"
      status: public
      description: >
        A long-running effort to digitise and carefully proof-read
        Sanskrit stotras, and typeset them beautifully across multiple
        Indic scripts — a whole organisation of repos, one per text or
        script edition (see below).
      links:
        - text: "stotrasamhita.net →"
          url: "https://stotrasamhita.net"
        - text: "GitHub org →"
          url: "https://github.com/StotraSamhita"

    - title: "Devanagari Flashcards"
      status: public
      description: >
        Flashcards for learning Devanagari alongside other South
        Indian scripts (IAST, Grantha, Kannada, Telugu) — LaTeX-built
        printable PDFs plus a vocabulary spreadsheet.
      links:
        - text: "View on GitHub →"
          url: "https://github.com/sanskrit-coders/devanagari-flashcards"

