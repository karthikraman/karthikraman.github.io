- title: "Pūjā Vidhānam"
  status: public
  description: >
    A comprehensive collection of Sanskrit mantras, verses and
    step-by-step pūjā instructions for performing various pūjās and
    vratas at home — saṅkalpa, the sixteen upacāra offerings, deity-specific
    mantras, narratives from purāṇa-s traditionally recited during specific observances, and
    reference appendices for lunar months, constellations and ritual
    elements. 
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/puja-vidhanam"
    - text: "View text in multiple scripts →"
      url: "https://stotrasamhita.github.io/pujavidhanam"

- title: "Tulā Kāverī Māhātmyam"
  status: public
  description: >
    The Tulā Kāverī Māhātmyam — the Puranic text glorifying the
    sanctity of the Kāverī river, traditionally recited during Tulā
    Saṅkramaṇa, the sun's transit into Tulā rāśi. Ongoing - alpha stage.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/TulaKaveriMahatmyam"
