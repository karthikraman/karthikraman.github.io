- title: "Stotra Sangrahah"
  status: public
  description: >
    A LaTeX-typeset archive of Sanskrit devotional hymns (stotras),
    sourced from sanskritdocuments.org, old scanned texts and elsewhere, and then
    corrected and typeset. This is the one that started it all — first
    published in May 2008, inspired by my grandfather's
    handwritten collection. Compiled into one comprehensive volume,
    themed booklets (Navarātri, daily recitation, a children's primer),
    and individual per-deity PDFs, across five page-size editions from
    A5 digital to Kindle Scribe.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/stotra-sangrahah"
    - text: "View text in multiple scripts →"
      url: "https://stotrasamhita.github.io/stotras/"

- title: "Vedamantra Book"
  status: public
  description: >
    Vedic texts of the Taittirīya Śākhā of the Kṛṣṇa Yajurveda in
    Devanagari: a curated Mantras collection for daily worship (Puruṣa
    Sūktam, Śrī Sūktam, Rudra Praśna, Sandhyāvandanam), the complete
    Taittirīya Āraṇyaka (ten Praśnas plus associated Upaniṣads), the
    full Taittirīya Brāhmaṇa (eight Aṣṭakas), and the entire Taittirīya
    Saṃhitā (seven Kāṇḍas). Typeset in the Siddhanta font, with digital,
    Kindle, Kindle Scribe, print and reMarkable editions.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/vedamantra-book"

- title: "Bhagavad Gītā"
  status: public
  description: >
    A complete Devanagari edition of all 18 chapters of the Gītā,
    including the preparatory recitation (nyāsa) and traditional praise
    verses (māhātmyam), word-by-word padaccheda splits for every verse,
    and alphabetical verse and word concordances (~3,800 unique Sanskrit
    words) — bidirectionally hyperlinked between the main text and the
    word splits. Digital, Kindle, print and annotated editions.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/gita"
    - text: "View text in multiple scripts →"
      url: "https://stotrasamhita.github.io/gita/"

- title: "Mahābhāratam"
  status: public
  description: >
    A digitised, typeset edition of the full Mahābhārata across all 18
    traditional parvas, based on the early-1900s Kumbhakoṇam edition
    (the Southern recension), digitised via the SARIT project. Built
    through a TEI-XML → per-parva JSON → LaTeX pipeline, with custom
    scripts to handle Sanskrit sandhi corrections along the way.
    Available as a full two-column edition and a Kindle-optimized
    single-column edition, plus standalone parvas such as the Virāṭa
    Parva. **Only Virāṭa Parva has been carefully proofread**.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/Mahabharatam"
    - text: "View Virāṭa Parva in multiple scripts →"
      url: "https://stotrasamhita.github.io/mahabharatam/04-vir%C4%81%E1%B9%ADaparva/chapter-01/"

- title: "Vālmīki Rāmāyaṇam"
  status: public
  description: >
    A LaTeX/PDF edition of the Vālmīki Rāmāyaṇa, organized by kāṇḍa,
    generated through a JSON-to-TeX pipeline that automatically applies
    śloka macros based on line length and adds chapter annotations.
    Kindle and print editions.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/ValmikiRamayanam"

- title: "Adhyātma Rāmāyaṇam"
  status: public
  description: >
    The Adhyātma Rāmāyaṇa in Sanskrit — the philosophical and
    devotional retelling of Rāma's story that frames Rāma as
    Brahman itself. Print, Kindle and Kindle Scribe editions.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/AdhyatmaRamayanam"
    - text: "View text in multiple scripts →"
      url: "https://stotrasamhita.github.io/adhyatma-ramayanam/"


- title: "Rāmāyaṇa Ratnākara"
  status: public
  description: >
    A collection of Rāmāyaṇa stories gathered from across the
    Itihāsas and Purāṇas — supplementary narratives and episodes of
    Rāma's life (rāma-caritam) beyond the core Vālmīki text, alongside
    related stotras.
  links:
    - text: "View on GitHub →"
      url: "https://github.com/StotraSamhita/RamayanaRatnakara"

